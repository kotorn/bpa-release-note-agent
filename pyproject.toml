[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bpa-release-note-agent"
version = "0.1.0"
description = "Synthetic reference implementation for validating release-change events."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "jsonschema==4.26.0",
]

[project.scripts]
bpa-release-validate = "bpa_release_validate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

